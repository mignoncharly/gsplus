server {
    if ($host = www.gsplus.vip) {
        return 301 https://gsplus.vip$request_uri;
    }

    server_name gsplus.vip www.gsplus.vip 178.105.50.226;

    root /var/www/goldenstudioplus/frontend/dist;
    index index.html;
    server_tokens off;

    client_max_body_size 9M;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-mXrHd274Pe4j55OVKQMd35ztM8fym1sMUg2jwdyIvm8=' 'sha256-79Qo2Zr09XreThhQcmDTXccVXgxUFVwAwZrxqavQz18='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Origin-Agent-Cluster "?1" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Origin-Agent-Cluster;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-DNS-Prefetch-Control;
        proxy_hide_header X-Download-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_hide_header X-XSS-Protection;
    }

    location /uploads/ {
        alias /var/www/goldenstudioplus/uploads/;
        autoindex off;
        access_log off;
        expires 30d;
        limit_except GET HEAD {
            deny all;
        }
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ^~ /admin/ {
        try_files $uri.html /admin.html;
        limit_except GET HEAD {
            deny all;
        }
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gsplus.vip/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gsplus.vip/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.gsplus.vip) {
        return 301 https://gsplus.vip$request_uri;
    } # managed by Certbot

    if ($host = gsplus.vip) {
        return 301 https://gsplus.vip$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name gsplus.vip www.gsplus.vip 178.105.50.226;
    server_tokens off;
    return 404; # managed by Certbot
}
